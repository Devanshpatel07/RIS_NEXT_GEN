<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="risGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3A8C" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#00A8F0" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8F0" />
      <stop offset="100%" stop-color="#60D5FF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00A8F0" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded hexagon or shield badge subtle glow -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#EAF5FF" />
  <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke="url(#risGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Pixel Blocks (Tech Accent) -->
  <rect x="68" y="22" width="8" height="8" rx="2" fill="#00A8F0" opacity="0.9" />
  <rect x="78" y="16" width="6" height="6" rx="1.5" fill="#1565C0" opacity="0.75" />
  <rect x="74" y="32" width="7" height="7" rx="1.5" fill="#0B3A8C" opacity="0.6" />
  <rect x="18" y="66" width="6" height="6" rx="1.5" fill="#00A8F0" opacity="0.4" />
  <rect x="22" y="74" width="7" height="7" rx="1.5" fill="#1565C0" opacity="0.5" />

  <!-- The "R" Shape and Upward Arrow -->
  <!-- Stem of R -->
  <rect x="26" y="24" width="12" height="52" rx="3" fill="url(#risGrad)" />
  
  <!-- Upper loop of R -->
  <path d="M 38 24 L 56 24 C 67 24 73 30 73 39 C 73 48 67 54 56 54 L 38 54 Z" fill="url(#risGrad)" />
  <!-- Inner cutout of loop -->
  <path d="M 38 34 L 54 34 C 59 34 62 36 62 39 C 62 42 59 44 54 44 L 38 44 Z" fill="#EAF5FF" />

  <!-- Diagonal leg of R transformed into an UPWARD GROWTH ARROW -->
  <path d="M 47 48 L 68 76 L 56 76 L 41 53 Z" fill="url(#risGrad)" />
  
  <!-- Dynamic Upward Growth Arrow integrated in the upper-right -->
  <polygon points="64,28 76,16 68,16 68,10 82,10 82,24 76,24 76,16" fill="url(#arrowGrad)" filter="url(#softGlow)" />
</svg>
